[project]
name = "voices"
version = "0.1.0"
description = "Community Voices backend: ingestion, tagging, reports and the API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "fastapi==0.115.6",
    "fastembed==0.4.2",
    "httpx==0.28.1",
    "langchain-core==0.3.28",
    "langchain-openai==0.2.14",
    "langgraph==0.2.60",
    "pgvector==0.3.6",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "scikit-learn==1.6.0",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -p no:cacheprovider -m "not database"'  # no cache: non-root containers can't write one
markers = ["database: needs a running Postgres; run with -m database"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
