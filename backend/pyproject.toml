[project]
name = "voices"
version = "0.1.0"
description = "Community Voices backend: ingestion, tagging, reports and the API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "fastapi==0.115.6",
    "pgvector==0.3.6",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"  # tests run in throwaway containers; a cache only fails to write

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
