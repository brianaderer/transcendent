# Alembic settings. The database address is filled in at run time from DATABASE_URL
# (see voices/db/setup.py and migrations/env.py), never written here.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
